# Weekly catalog refresh: fetch fresh Coursedog data per school and re-seed.
#
# Operational notes:
# - Raw JSON is 100 MB+ per school; it is fetched fresh every run and never
#   committed or cached.
# - GitHub disables scheduled workflows after 60 days without repo activity
#   and does NOT notify when that happens (scheduled runs don't count as
#   activity). If development goes quiet, add a keepalive action or an
#   external heartbeat ping on this workflow.
# - The SUPABASE_SERVICE_ROLE_KEY must be stored as an ENVIRONMENT secret on
#   a "catalog-refresh" environment restricted to the main branch — it
#   bypasses RLS on user data, not just catalog tables.
name: catalog-refresh

on:
  schedule:
    # Mondays 06:17 UTC — off-peak odd minute; top-of-hour runs queue badly.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      school:
        description: "Single school slug (blank = all schools)"
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false # queue behind an in-flight refresh, never kill a half-finished seed

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      schools: ${{ steps.set.outputs.schools }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: set
        env:
          SCHOOL_INPUT: ${{ inputs.school }}
        run: |
          if [ -n "$SCHOOL_INPUT" ]; then
            # Validate the dispatch input against schools.json (never trust it raw).
            if ! jq -e --arg s "$SCHOOL_INPUT" 'any(.[]; .slug == $s)' packages/catalog/schools.json > /dev/null; then
              echo "Unknown school slug: $SCHOOL_INPUT" >&2
              exit 1
            fi
            echo "schools=[\"$SCHOOL_INPUT\"]" >> "$GITHUB_OUTPUT"
          else
            echo "schools=$(jq -c '[.[].slug]' packages/catalog/schools.json)" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90 # default 360 would burn 6h on a hung fetch
    environment: catalog-refresh
    strategy:
      fail-fast: false # one school's failure never cancels the others
      max-parallel: 1 # polite to Coursedog; serialized DB writes
      matrix:
        school: ${{ fromJSON(needs.matrix.outputs.schools) }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
      # The seed step runs repo TypeScript with the service-role key in env;
      # postinstall scripts stay disabled as defense in depth.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @major-map/shared build && pnpm --filter @major-map/catalog build
      - name: Fetch catalog
        env:
          SCHOOL: ${{ matrix.school }}
        run: pnpm catalog:fetch "--school=$SCHOOL"
      - name: Seed database
        # Service-role key is scoped to this step only — install/build/fetch
        # run repo code that must never see it.
        env:
          SCHOOL: ${{ matrix.school }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm catalog:seed "--school=$SCHOOL" | tee seed-output.log
      - name: Job summary
        if: always()
        env:
          SCHOOL: ${{ matrix.school }}
        run: |
          {
            echo "## ${SCHOOL}"
            echo '```'
            grep -E "^SUMMARY: " seed-output.log || echo "no summary lines captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
